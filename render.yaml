services:
  - type: web
    name: neurologist
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEBUG
        value: False
      - key: PORT
        value: 10000
    staticPublishPath: ./staticfiles
